<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreamcast Web</title>
<style>
  :root { --bg: #0d0f14; --panel: #161a22; --line: #2a3140; --text: #e6e9ef; --muted: #8a93a6; --accent: #f08a24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  #setup { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h1 span { color: var(--accent); }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; padding: 22px; margin-bottom: 14px; background: var(--panel); cursor: pointer; transition: border-color .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); }
  .drop strong { display: block; }
  .drop small { color: var(--muted); }
  .drop .files { white-space: pre-line; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 13px; color: var(--accent); word-break: break-all; }
  .drop input { display: none; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #111; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .err { color: #ff6b6b; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 28px; font-size: 14px; }
  td { padding: 4px 0; border-bottom: 1px solid var(--line); }
  td:first-child { font-family: ui-monospace, monospace; color: var(--accent); width: 40%; }
  #game-wrap { display: none; position: fixed; inset: 0; background: #000; }
  #game { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="setup">
  <h1>Dreamcast <span>Web</span></h1>
  <p class="sub">Flycast WASM running on EmulatorJS. Your files stay on this machine and are never uploaded anywhere.</p>

  <label class="drop" id="rom-drop">
    <strong>1. Game image</strong>
    <small>.chd or .cdi (one file), .gdi plus all its track files (select them together), or a .zip/.7z containing them</small>
    <input type="file" id="rom" multiple>
    <div class="files" id="rom-list"></div>
  </label>

  <label class="drop" id="bios-drop">
    <strong>2. BIOS</strong>
    <small>Select both dc_boot.bin and dc_flash.bin, dumped from your own Dreamcast. This core can't boot without them.</small>
    <input type="file" id="bios" multiple accept=".bin">
    <div class="files" id="bios-list"></div>
  </label>

  <button id="start" disabled>Start</button>
  <div class="err" id="err"></div>

  <table>
    <tr><td>W A S D</td><td>Analog stick (move)</td></tr>
    <tr><td>Arrow keys</td><td>D-pad</td></tr>
    <tr><td>J / K / L / I</td><td>A / B / X / Y</td></tr>
    <tr><td>Q / E</td><td>L / R triggers (camera)</td></tr>
    <tr><td>Enter</td><td>Start</td></tr>
    <tr><td>Gamepad</td><td>Plug in and press a button; works automatically</td></tr>
  </table>
</div>

<div id="game-wrap"><div id="game"></div></div>

<script>
const $ = (id) => document.getElementById(id);
const picked = { rom: [], bios: [] };

if (!window.crossOriginIsolated) {
  $("err").textContent = "Not cross-origin isolated. Start this with serve.py rather than opening the file directly.";
}

// Browsers keep audio muted until the first user gesture; resume any contexts the core created.
const audioContexts = [];
for (const name of ["AudioContext", "webkitAudioContext"]) {
  const Orig = window[name];
  if (!Orig) continue;
  window[name] = class extends Orig { constructor(...a) { super(...a); audioContexts.push(this); } };
}
const resumeAudio = () => audioContexts.forEach(c => c.state === "suspended" && c.resume());
["keydown", "pointerdown", "touchstart"].forEach(t => window.addEventListener(t, resumeAudio, true));

// A file served by serve.py, shaped like a File (name, size, arrayBuffer) so the patch treats both alike.
function localFile(f) {
  return {
    name: f.name,
    size: f.size,
    async arrayBuffer(onProgress) {
      const res = await fetch(f.url);
      if (!res.ok) throw new Error("Could not load " + f.name + " (" + res.status + ")");
      const buf = new Uint8Array(f.size), reader = res.body.getReader();
      let off = 0, last = -1;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf.set(value, off);
        off += value.length;
        const pct = Math.floor(off * 100 / f.size);
        if (onProgress && pct !== last) onProgress(last = pct);
      }
      return buf.buffer;
    }
  };
}

function setFiles(kind, list) {
  picked[kind] = Array.from(list);
  $(kind + "-list").textContent = picked[kind].map(f => f.name + "  (" + (f.size / 1048576).toFixed(1) + " MB)").join("\n");
  $("start").disabled = !(picked.rom.length && biosReady());
}

for (const kind of ["rom", "bios"]) {
  const drop = $(kind + "-drop");
  $(kind).addEventListener("change", (e) => setFiles(kind, e.target.files));
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); setFiles(kind, e.dataTransfer.files); });
}

function controls() {
  const pad = ["BUTTON_2","BUTTON_4","SELECT","START","DPAD_UP","DPAD_DOWN","DPAD_LEFT","DPAD_RIGHT",
    "BUTTON_1","BUTTON_3","LEFT_TOP_SHOULDER","RIGHT_TOP_SHOULDER","LEFT_BOTTOM_SHOULDER","RIGHT_BOTTOM_SHOULDER",
    "LEFT_STICK","RIGHT_STICK","LEFT_STICK_X:+1","LEFT_STICK_X:-1","LEFT_STICK_Y:+1","LEFT_STICK_Y:-1",
    "RIGHT_STICK_X:+1","RIGHT_STICK_X:-1","RIGHT_STICK_Y:+1","RIGHT_STICK_Y:-1"];
  // RetroPad slot -> key. Flycast maps RetroPad B/A/Y/X to Dreamcast A/B/X/Y and L2/R2 to the triggers.
  const keys = { 0: "j", 1: "l", 3: "enter", 4: "up arrow", 5: "down arrow", 6: "left arrow", 7: "right arrow",
    8: "k", 9: "i", 12: "q", 13: "e", 16: "d", 17: "a", 18: "s", 19: "w" };
  const p1 = {};
  pad.forEach((v2, i) => { p1[i] = { value: keys[i] || "", value2: v2 }; });
  return { 0: p1, 1: {}, 2: {}, 3: {} };
}

function biosReady() {
  const bios = picked.bios.map(f => f.name.toLowerCase());
  return bios.includes("dc_boot.bin") && bios.includes("dc_flash.bin");
}

// Auto-run: when serve.py was given a game (config.json or --game), boot it straight away.
fetch("autorun.json").then(r => r.ok ? r.json() : null).then(auto => {
  if (!auto || !auto.game.length) return;
  setFiles("rom", auto.game.map(localFile));
  if (auto.bios.length) setFiles("bios", auto.bios.map(localFile));
  if (biosReady()) start();
  else $("err").textContent = "Game found on disk. Put dc_boot.bin and dc_flash.bin in the bios/ folder (or pick them above) to boot it.";
}).catch(() => {});

$("start").addEventListener("click", () => start());

function start() {
  window.DC_FILES = { rom: picked.rom, bios: picked.bios };
  const main = picked.rom.find(f => /\.(gdi|cdi|chd|cue)$/i.test(f.name)) || picked.rom[0];

  window.EJS_player = "#game";
  window.EJS_core = "flycast";
  window.EJS_pathtodata = "ejs/data/";
  window.EJS_gameUrl = "dreamcast-game";   // placeholder; dc-patches.js supplies the real files
  window.EJS_gameName = main.name.replace(/\.[^.]+$/, "");
  window.EJS_DEBUG_XX = true;              // load unminified sources (no build step needed)
  window.EJS_startOnLoaded = true;
  window.EJS_threads = false;
  window.EJS_defaultControls = controls();
  window.EJS_defaultOptions = {
    reicast_hle_bios: "disabled",
    reicast_boot_to_bios: "disabled",
    reicast_threaded_rendering: "disabled",
    reicast_internal_resolution: "640x480",
    reicast_alpha_sorting: "per-strip (fast, least accurate)"
  };

  $("setup").style.display = "none";
  $("game-wrap").style.display = "block";
  const s = document.createElement("script");
  s.src = "ejs/data/loader.js";
  document.body.appendChild(s);
}
</script>
</body>
</html>
